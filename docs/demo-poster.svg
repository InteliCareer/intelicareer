<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Watch the InteliCareer demo — 90 second walkthrough">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid backdrop -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200M0 600h1200"/>
    <path d="M100 0v675M200 0v675M300 0v675M400 0v675M500 0v675M600 0v675M700 0v675M800 0v675M900 0v675M1000 0v675M1100 0v675"/>
  </g>

  <!-- Play button -->
  <g transform="translate(600 320)" filter="url(#glow)">
    <circle r="92" fill="url(#play)" opacity="0.18"/>
    <circle r="68" fill="url(#play)"/>
    <path d="M-22 -28 L 32 0 L -22 28 Z" fill="white"/>
  </g>

  <!-- Title -->
  <text x="600" y="500" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#e2e8f0" letter-spacing="-1">
    InteliCareer — Demo Walkthrough
  </text>
  <text x="600" y="544" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">
    chat-driven Auto Apply · A–F job scoring · saved &amp; applied tracking
  </text>
  <text x="600" y="600" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#64748b" letter-spacing="2" font-weight="600">
    ▶  CLICK TO PLAY (90s)
  </text>
</svg>
