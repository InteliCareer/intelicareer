version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: intelicareer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: intelicareer
      POSTGRES_PASSWORD: intelicareer_pass
      POSTGRES_DB: intelicareer
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U intelicareer']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: intelicareer_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://intelicareer:intelicareer_pass@postgres:5432/intelicareer
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_REFRESH_SECRET: dev_refresh_secret_change_in_production
      PORT: 3001
      NODE_ENV: development
      FRONTEND_URL: http://localhost:3000
    ports:
      - '3001:3001'
    volumes:
      - ./src/backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: intelicareer_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXTAUTH_SECRET: dev_nextauth_secret
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - '3000:3000'
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
